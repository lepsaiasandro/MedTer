# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - medter

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # SPA is built during `dotnet publish` (see backend.csproj BuildClientApp)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MedTer-main/medter.client/package-lock.json

      - name: Build with dotnet
        run: dotnet build MedTer-main/backend/backend.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish MedTer-main/backend/backend.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_225787E508CF451DA61FFFA108845333 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5CFEA9AFFA16408B92D1C0DB4628F821 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9ED114E2A25D48BDA2527462B328D7A9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'medter'
          slot-name: 'Production'
          package: .

      # Optional: set GitHub secrets MEDTER_SQL_CONNECTION_STRING, MEDTER_JWT_KEY, MEDTER_SEED_ADMIN_PASSWORD
      # Use SQL User ID/Password — not "Active Directory Default"
      - name: Configure App Service connection + settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            if [ -z "${SQL_CONNECTION_STRING:-}" ]; then
              echo "Skipping Azure config (secret MEDTER_SQL_CONNECTION_STRING not set)."
              exit 0
            fi
            RG=$(az webapp list --query "[?name=='medter'].resourceGroup" -o tsv | head -n1)
            echo "Resource group: $RG"
            az webapp config connection-string set \
              --resource-group "$RG" \
              --name medter \
              --connection-string-type SQLAzure \
              --settings "Default=${SQL_CONNECTION_STRING}"
            az webapp config appsettings set \
              --resource-group "$RG" \
              --name medter \
              --settings \
                ASPNETCORE_ENVIRONMENT=Production \
                Jwt__Key="${JWT_KEY}" \
                Jwt__Issuer=medter \
                Jwt__Audience=medter \
                Seed__AdminPassword="${SEED_ADMIN_PASSWORD}" \
                Seed__Demo=true
            az webapp restart --resource-group "$RG" --name medter
        env:
          SQL_CONNECTION_STRING: ${{ secrets.MEDTER_SQL_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.MEDTER_JWT_KEY }}
          SEED_ADMIN_PASSWORD: ${{ secrets.MEDTER_SEED_ADMIN_PASSWORD }}
